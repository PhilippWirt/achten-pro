name: Einmalige Website-Endkorrektur

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-site.yml

permissions:
  contents: write

concurrency:
  group: einmalige-website-endkorrektur
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ausgangsstand schützen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "68b30aff97c9571039fe885bff26e88594d37eef"

      - name: Geprüfte Endkorrektur anwenden
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip -dc > /tmp/finalize_site_once.py
          python3 /tmp/finalize_site_once.py
          python3 build.py
          python3 tests/verify_build.py
          git diff --check

      - name: Einmaligen Workflow entfernen und veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix navigation and portrait crop"
          git push origin HEAD:main
